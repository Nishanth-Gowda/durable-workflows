services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootworkflow
      MYSQL_USER: workflow
      MYSQL_PASSWORD: workflow
      MYSQL_DATABASE: workflows
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uworkflow -pworkflow --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  engine:
    build:
      context: ./backend
    environment:
      MYSQL_DSN: workflow:workflow@tcp(mysql:3306)/workflows?parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27
      ENGINE_MODE: all
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  mysql_data:
