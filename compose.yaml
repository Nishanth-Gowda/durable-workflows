services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflows
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflows"]
      interval: 2s
      timeout: 2s
      retries: 20

  engine:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://workflow:workflow@postgres:5432/workflows?sslmode=disable
      ENGINE_MODE: all
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
